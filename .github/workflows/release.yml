name: Release

on:
  push:
    tags:
      - 'release-v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
      dmg_name: ${{ steps.package.outputs.dmg_name }}
      dmg_sha256: ${{ steps.package.outputs.dmg_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#release-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION (tag: $TAG)"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Build (release, universal)
        run: |
          set -euo pipefail
          # Build for both architectures so we can ship a universal binary.
          swift build -c release --arch arm64 --arch x86_64

      - name: Run tests
        run: |
          set -euo pipefail
          if swift test --list-tests 2>/dev/null | grep -q .; then
            swift test -c release
          else
            echo "No tests defined; skipping."
          fi
        continue-on-error: false

      - name: Assemble .app bundle
        id: package
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Sign every release with ONE reusable self-signed certificate so the
          # app keeps a stable code-signing identity. macOS TCC keys Screen
          # Recording / Accessibility grants to that identity, so users do not
          # have to re-authorize on every update.
          #
          # This is NOT a Developer ID cert — Gatekeeper still warns about an
          # "unidentified developer" on first launch. To remove that too, get an
          # Apple Developer account and switch to a notarized Developer ID cert.
          #
          # Generate the cert once with scripts/generate-signing-cert.sh, then
          # set these GitHub repo secrets:
          #   MACOS_CERTIFICATE       — base64 of the signing .p12
          #   MACOS_CERTIFICATE_PWD   — the .p12 export password
          #   MACOS_SIGNING_IDENTITY  — cert common name
          #   KEYCHAIN_PASSWORD       — any throwaway string
          #
          # Without the secrets the build falls back to ad-hoc signing: still
          # launchable, but the re-authorize-every-update problem returns.
          if [ -n "${MACOS_CERTIFICATE:-}" ]; then
            echo "Signing with self-signed certificate: $MACOS_SIGNING_IDENTITY"
            echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security import certificate.p12 -k build.keychain \
              -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" build.keychain
            rm -f certificate.p12
            export SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY"
          else
            echo "warning: MACOS_CERTIFICATE secret not set — falling back to ad-hoc signing." >&2
            echo "warning: users will have to re-authorize permissions on every update." >&2
            # bundle.sh only auto-creates the local dev identity when
            # SIGN_IDENTITY is left at its default, so "-" keeps CI on ad-hoc.
            export SIGN_IDENTITY="-"
          fi

          # scripts/bundle.sh is the single source of truth for assembling the
          # bundle: universal build, Info.plist metadata, icon, menu bar SVG,
          # localizations, SwiftPM resource bundles, and signing. This workflow
          # used to duplicate all of it, which is how it drifted out of sync
          # with the product name and kept failing here.
          CONFIG=release UNIVERSAL=1 bash scripts/bundle.sh

          APP_NAME="Ya cap"
          APP_DIR="build/${APP_NAME}.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "error: bundle.sh did not produce $APP_DIR" >&2
            exit 1
          fi

          # Fail fast if the shipped binary isn't a universal (arm64 + x86_64)
          # slice — Intel Mac users can't run an arm64-only build.
          ARCHS="$(lipo -archs "$APP_DIR/Contents/MacOS/$APP_NAME")"
          echo "Binary archs: $ARCHS"
          case "$ARCHS" in
            *arm64*x86_64*|*x86_64*arm64*) : ;;
            *) echo "error: shipped binary is not universal (archs: $ARCHS)" >&2; exit 1 ;;
          esac

          # The release must carry the version from the tag. A mismatch means
          # Info.plist was not bumped before tagging. Only the base version is
          # compared, so a pre-release tag (release-v1.0.6-rc1) still matches a
          # 1.0.6 bundle — CFBundleShortVersionString takes no suffix.
          BASE_VERSION="${VERSION%%-*}"
          BUNDLED_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Contents/Info.plist")"
          if [ "$BUNDLED_VERSION" != "$BASE_VERSION" ]; then
            echo "error: tag says $BASE_VERSION but Info.plist says $BUNDLED_VERSION" >&2
            exit 1
          fi

          # Package as zip
          ARTIFACT="Ya-cap-${VERSION}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ARTIFACT"

          # Compute checksum for transparency
          SHA256="$(shasum -a 256 "$ARTIFACT" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$ARTIFACT" > "${ARTIFACT}.sha256"

          # Package as a draggable DMG for users who prefer the native
          # Applications-folder install flow.
          DMG_ARTIFACT="Ya-cap-${VERSION}-macos.dmg"
          bash scripts/create-dmg.sh "$APP_DIR" "$DMG_ARTIFACT" "$APP_NAME"

          DMG_SHA256="$(shasum -a 256 "$DMG_ARTIFACT" | awk '{print $1}')"
          printf '%s  %s\n' "$DMG_SHA256" "$DMG_ARTIFACT" > "${DMG_ARTIFACT}.sha256"

          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$DMG_SHA256" >> "$GITHUB_OUTPUT"
          ls -lh "$ARTIFACT" "${ARTIFACT}.sha256" "$DMG_ARTIFACT" "${DMG_ARTIFACT}.sha256"

      # ---------------------------------------------------------------
      # Notarization (DISABLED — uncomment when signing is enabled)
      # ---------------------------------------------------------------
      # Required GitHub Secrets:
      #   AC_USERNAME    — Apple ID email
      #   AC_PASSWORD    — app-specific password
      #   AC_TEAM_ID     — Apple Developer Team ID
      #
      # - name: Notarize
      #   env:
      #     AC_USERNAME: ${{ secrets.AC_USERNAME }}
      #     AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      #     AC_TEAM_ID:  ${{ secrets.AC_TEAM_ID }}
      #   run: |
      #     ARTIFACT="${{ steps.package.outputs.artifact_name }}"
      #     xcrun notarytool submit "$ARTIFACT" \
      #       --apple-id "$AC_USERNAME" \
      #       --password "$AC_PASSWORD" \
      #       --team-id  "$AC_TEAM_ID" \
      #       --wait
      #     # Staple the ticket so Gatekeeper accepts the app offline
      #     ditto -x -k "$ARTIFACT" notarized
      #     xcrun stapler staple "notarized/Ya cap.app"
      #     rm "$ARTIFACT"
      #     ditto -c -k --sequesterRsrc --keepParent "notarized/Ya cap.app" "$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ya-cap-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.artifact_name }}
            ${{ steps.package.outputs.artifact_name }}.sha256
            ${{ steps.package.outputs.dmg_name }}
            ${{ steps.package.outputs.dmg_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: Ya-cap-${{ needs.build.outputs.version }}
          path: dist

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          NOTES_FILE="release-notes.md"

          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              BEGIN { found = 0 }
              /^## \[/ {
                if (found) { exit }
                # Match e.g.  ## [1.2.3] - 2026-04-09  or  ## [1.2.3]
                if ($0 ~ ("\\[" ver "\\]")) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            {
              echo "Release v${VERSION}"
              echo
              echo "_See commit history for details._"
            } > "$NOTES_FILE"
          fi

          echo "---- release notes ----"
          cat "$NOTES_FILE"
          echo "-----------------------"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.build.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Homebrew tap dispatch was removed: it pointed at
      # realskyrin/homebrew-tap, which belongs to the upstream project, not this
      # repository. There is no tap for Ya cap, and the README no longer
      # documents a Homebrew install path.
